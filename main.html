<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastRTC Video Call</title>
  <style>
    :root {
  color-scheme: dark;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #090b11;
  color: #e7eaf3;
  accent-color: #6c80ff;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  background: radial-gradient(circle at top left, rgba(108, 128, 255, 0.16), transparent 28%),
    radial-gradient(circle at bottom right, rgba(18, 214, 165, 0.12), transparent 26%),
    #07090f;
}

.app-shell {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
  padding: 18px 22px;
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(14px);
}

.top-bar h1 {
  margin: 0 0 6px;
  font-size: clamp(1.8rem, 2.4vw, 2.4rem);
}

.subtitle {
  margin: 0;
  color: #bbc2db;
  font-size: 0.95rem;
}

.status-pill {
  padding: 10px 18px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.95rem;
  color: #fff;
  background: #3f4b73;
}

.status-pill.connected {
  background: #16c79a;
}

.status-pill.connecting {
  background: #f2c94c;
}

.status-pill.error {
  background: #f24545;
}

.main-grid {
  display: grid;
  grid-template-columns: minmax(280px, 380px) 1fr;
  gap: 22px;
}

.panel {
  border-radius: 28px;
  padding: 22px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  box-shadow: 0 40px 120px rgba(0, 0, 0, 0.18);
}

.card {
  display: grid;
  gap: 12px;
  margin-bottom: 18px;
}

.card:last-child {
  margin-bottom: 0;
}

label {
  font-size: 0.95rem;
  color: #b7c0f2;
}

input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.04);
  color: #eff2ff;
  font-size: 1rem;
}

input:focus {
  outline: none;
  border-color: rgba(108, 128, 255, 0.9);
  box-shadow: 0 0 0 4px rgba(108, 128, 255, 0.12);
}

.btn {
  width: 100%;
  padding: 14px 18px;
  border-radius: 16px;
  border: none;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  color: #eff2ff;
  background: rgba(255, 255, 255, 0.08);
  transition: transform 0.2s ease, background 0.2s ease;
}

.btn:hover:not(:disabled) {
  transform: translateY(-1px);
  background: rgba(108, 128, 255, 0.16);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn--primary {
  background: linear-gradient(135deg, #6c80ff, #4b6ce6);
}

.btn--danger {
  background: linear-gradient(135deg, #ff5d6d, #d3404c);
}

.card--button-row {
  display: grid;
  gap: 12px;
}

.info-line {
  margin: 0;
  color: #9aa3c7;
  font-size: 0.95rem;
}

.panel--video {
  display: grid;
  gap: 22px;
}

.video-card {
  position: relative;
  border-radius: 24px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.08);
  min-height: 320px;
}

.card--controls-inline {
  display: flex;
  gap: 10px;
}

.btn.small {
  padding: 10px 12px;
  border-radius: 12px;
  font-size: 0.95rem;
}

.video-card .overlay {
  position: absolute;
  right: 12px;
  bottom: 12px;
  z-index: 3;
  display: flex;
  gap: 8px;
}

.video-label {
  position: absolute;
  z-index: 2;
  left: 18px;
  top: 18px;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 0.85rem;
  color: #eff2ff;
  background: rgba(16, 24, 57, 0.82);
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #07080c;
}

@media (max-width: 880px) {
  .main-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 520px) {
  .app-shell {
    padding: 16px;
  }

  .top-bar {
    flex-direction: column;
    align-items: flex-start;
  }
}
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div>
        <h1>FastRTC Video Call</h1>
        <p class="subtitle">Two-user video calling with Hugging Face TURN</p>
      </div>
      <div class="status-pill" id="connectionStatus">Disconnected</div>
    </header>

    <main class="main-grid">
      <section class="panel panel--controls">
        <div class="card">
          <label for="roomId">Room ID</label>
          <input id="roomId" type="text" placeholder="Enter a room code" autocomplete="off" />
        </div>

        <div class="card card--button-row">
          <button id="joinButton" class="btn btn--primary">Join Room</button>
          <button id="leaveButton" class="btn btn--danger" disabled>Leave Room</button>
        </div>

        <div class="card card--controls-inline">
          <button id="muteButton" class="btn">Mute</button>
          <button id="cameraButton" class="btn">Toggle Camera</button>
        </div>

        <div class="card">
          <p class="info-line">Max 2 participants. First participant becomes caller automatically.</p>
          <p class="info-line">Logs: open browser console for ICE/Connection/Signaling details.</p>
        </div>
      </section>

      <section class="panel panel--video">
        <div class="video-card">
          <div class="video-label">Local Preview</div>
          <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <div class="video-card">
          <div class="video-label">Remote</div>
          <video id="remoteVideo" autoplay playsinline></video>
        </div>
      </section>
    </main>

    <footer style="margin-top:18px;color:#9aa3c7;font-size:0.9rem">Server endpoints: <code>/ws</code> (WebSocket), <code>/turn</code> (ICE)</footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
